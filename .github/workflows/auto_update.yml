name: PPIM Auto Update Dashboard

on:
  push:
    paths:
      - 'data/ppim_report_*.csv'
  workflow_dispatch:

# กัน Run ชนกัน — ถ้ามี Run ใหม่เข้ามา ให้ยกเลิกตัวเก่าที่ยังค้าง
concurrency:
  group: ppim-dashboard-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install pandas openpyxl

      - name: Run processor
        run: python scripts/process.py

      - name: Commit and push (with retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add PPIM_Dashboard_v6.html
          if git diff --staged --quiet; then
            echo "ℹ️ ไม่มีการเปลี่ยนแปลง — ข้าม commit"
            exit 0
          fi
          git commit -m "Auto-update dashboard $(date +'%Y-%m-%d %H:%M')"

          # ลอง push สูงสุด 5 ครั้ง เผื่อมีคน push แทรกระหว่างนั้น
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ Push สำเร็จ (ครั้งที่ $i)"
              exit 0
            fi
            echo "⚠️ Push ครั้งที่ $i ไม่สำเร็จ — ดึงของใหม่มา rebase แล้วลองใหม่"
            git pull --rebase --autostash origin main || true
            sleep 5
          done

          echo "❌ Push ไม่สำเร็จหลังลอง 5 ครั้ง"
          exit 1
